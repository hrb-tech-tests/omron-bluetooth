<!DOCTYPE html>
<html lang="en" ng-app="omronApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMRON Web Bluetooth</title>
    <script src="angular.min.js"></script>
    <style>
        body, html {
            font-family: sans-serif;
            height: 100%;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .connection-bar {
            display: flex;
            margin-bottom: 10px;
        }
        #connectBtn {
            flex-grow: 1; /* Make button take full width */
            font-size: 1.2em; /* Make font bigger */
            padding: 12px 20px;
            border-radius: 8px; /* Rounded borders */
            border: none;
            background-color: orange;
            color: white;
            cursor: pointer;
        }
        #connectBtn:disabled {
            background-color: #cccccc;
        }
        .textarea-group {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        textarea {
            width: 100%;
            flex-grow: 1;
            border-radius: 4px;
            border: 1px solid #ccc;
            padding: 8px;
            box-sizing: border-box;
            font-family: monospace;
        }
        label {
            font-weight: bold;
        }
    </style>
</head>
<body ng-controller="OmronController as vm">

    <div class="container">
        <div class="connection-bar">
            <button id="connectBtn" ng-click="vm.connect()">Connect</button>
        </div>

        <div class="textarea-group">
            <div>
                <label for="jsonData">JSON Data:</label>
                <textarea id="jsonData" ng-model="vm.jsonData" rows="8"></textarea>
            </div>
            <div>
                <label for="logs">Logs:</label>
                <textarea id="logs" ng-model="vm.logs" rows="8" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        angular.module('omronApp', [])
            .controller('OmronController', function($scope, $log) {
                var vm = this;
                vm.jsonData = '';
                vm.logs = 'App started. Press Connect to search for devices.\n';
                vm.device = null;
                vm.server = null;
                vm.allMeasurements = [];

                const BLOOD_PRESSURE_SERVICE_UUID = '00001810-0000-1000-8000-00805f9b34fb';
                const BLOOD_PRESSURE_MEASUREMENT_CHARACTERISTIC_UUID = '00002a35-0000-1000-8000-00805f9b34fb';

                // --- Logging and Scope Management ---
                vm.log = function(message) {
                    console.log(message); // Also log to browser console for easier debugging
                    $scope.$applyAsync(() => {
                        vm.logs += message + '\n';
                    });
                };

                window.getAngularScope = function() {
                    var el = document.querySelector('[ng-controller]');
                    return angular.element(el).scope().vm;
                };

                // --- Data & State Management ---
                vm.clear = function() {
                    vm.allMeasurements = [];
                    $scope.$applyAsync(() => {
                        vm.jsonData = '';
                        vm.logs = 'App started. Press Connect to search for devices.\n';
                    });
                    if (window.codenameOne) {
                        window.codenameOne.callJSON('onDataReady', '');
                    }
                    vm.log('UI and data cleared.');
                };

                vm.connect = async function() {
                    vm.clear();
                    vm.log('Requesting Bluetooth device with service: ' + BLOOD_PRESSURE_SERVICE_UUID);
                    document.getElementById('connectBtn').disabled = true;

                    try {
                        vm.device = await navigator.bluetooth.requestDevice({
                            filters: [{ services: [BLOOD_PRESSURE_SERVICE_UUID] }],
                            optionalServices: ['battery_service']
                        });

                        vm.log(`Device selected: ${vm.device.name}`);
                        vm.device.addEventListener('gattserverdisconnected', vm.onDisconnected);

                        vm.log('Connecting to GATT Server...');
                        vm.server = await vm.device.gatt.connect();
                        vm.log('GATT Server connected.');

                        vm.log('Getting Blood Pressure Service...');
                        const service = await vm.server.getPrimaryService(BLOOD_PRESSURE_SERVICE_UUID);
                        vm.log('Service retrieved.');

                        vm.log('Getting Blood Pressure Measurement Characteristic...');
                        const characteristic = await service.getCharacteristic(BLOOD_PRESSURE_MEASUREMENT_CHARACTERISTIC_UUID);
                        vm.log('Characteristic retrieved.');

                        vm.log('Starting notifications...');
                        await characteristic.startNotifications();
                        characteristic.addEventListener('characteristicvaluechanged', vm.handleNotifications);
                        vm.log('✅ Connected and subscribed to notifications. Waiting for data...');

                    } catch(error) {
                        vm.log(`⚠️ Error: ${error.message}`);
                        document.getElementById('connectBtn').disabled = false;
                    }
                };

                vm.abort = function() {
                    if (vm.device && vm.device.gatt.connected) {
                        vm.log('Disconnecting from device...');
                        vm.device.gatt.disconnect();
                    } else {
                        vm.log('No device connected or already disconnected.');
                    }
                    vm.clear();
                    document.getElementById('connectBtn').disabled = false;
                };

                vm.onDisconnected = function() {
                    vm.log('Device disconnected.');
                    vm.device = null;
                    vm.server = null;
                    document.getElementById('connectBtn').disabled = false;
                    // Finalize data and notify Java side
                    $scope.$applyAsync(() => {
                        vm.jsonData = angular.toJson(vm.allMeasurements, true);
                    });
                    if (window.codenameOne && vm.allMeasurements.length > 0) {
                         vm.log('Notifying app that data capture is complete.');
                         window.codenameOne.callJSON('onDataReady', vm.jsonData);
                    }
                };

                // --- Data Parsing ---
                const parseSFloat = (dataView, offset) => {
                    const value = dataView.getUint16(offset, true);
                    let mantissa = value & 0x0FFF;
                    let exponent = value >> 12;
                    if (exponent >= 8) {
                        exponent = -((16 - exponent) & 0xF);
                    }
                    if (mantissa >= 2048) {
                        mantissa = -((4096 - mantissa) & 0xFFF);
                    }
                    return mantissa * Math.pow(10, exponent);
                };
                
                const parseTimestamp = (dataView, offset) => {
                    const year = dataView.getUint16(offset, true);
                    const month = dataView.getUint8(offset + 2) - 1; // JS months are 0-indexed
                    const day = dataView.getUint8(offset + 3);
                    const hours = dataView.getUint8(offset + 4);
                    const minutes = dataView.getUint8(offset + 5);
                    const seconds = dataView.getUint8(offset + 6);
                    return new Date(year, month, day, hours, minutes, seconds).toISOString();
                };

                vm.handleNotifications = function(event) {
                    const value = event.target.value; // This is a DataView
                    vm.log(`Received notification with ${value.byteLength} bytes.`);
                    
                    const flags = value.getUint8(0);
                    const isImperial = !(flags & 0x01); // 0 = mmHg, 1 = kPa
                    const hasTimestamp = flags & 0x02;
                    const hasPulseRate = flags & 0x04;
                    const hasUserId = flags & 0x08;
                    
                    let index = 1;

                    const measurement = {
                        units: isImperial ? 'mmHg' : 'kPa',
                        systolic: parseSFloat(value, index),
                        diastolic: parseSFloat(value, index + 2),
                        meanArterialPressure: parseSFloat(value, index + 4)
                    };
                    index += 6;

                    if (hasTimestamp) {
                        measurement.timestamp = parseTimestamp(value, index);
                        index += 7;
                    }

                    if (hasPulseRate) {
                        measurement.pulseRate = parseSFloat(value, index);
                        index += 2;
                    }
                    
                    if (hasUserId) {
                        measurement.userId = value.getUint8(index);
                        index += 1;
                    }

                    vm.allMeasurements.push(measurement);
                    vm.log(`Parsed measurement: Sys: ${measurement.systolic}, Dia: ${measurement.diastolic}`);
                    
                    $scope.$applyAsync(() => {
                        // Update JSON data live
                        vm.jsonData = angular.toJson(vm.allMeasurements, true);
                    });
                };
                
                // --- Functions for Java Bridge ---
                vm.getJsonData = function() {
                    return vm.jsonData;
                };

                vm.getLogs = function() {
                    return vm.logs;
                };
            });
    </script>
</body>
</html>
